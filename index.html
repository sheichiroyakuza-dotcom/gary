/* ====== PARSE EXCEL ====== */
function normKey(s){ return s.toLowerCase().replace(/[^a-z0-9]/g,''); }
function cleanDisplay(s){ s = String(s).replace(/\s+/g,' ').trim(); return s.replace(/\s+,/g,','); }

function parseWorkbook(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});

  // cari baris header (sel pertama bernilai "HARI")
  let hi = raw.findIndex(r => r && r[0] && String(r[0]).trim().toUpperCase() === 'HARI');
  if(hi < 0) throw new Error('Baris header "HARI" tidak ditemukan.');
  const header = raw[hi].map(c => c == null ? null : String(c).trim());
  const kelasCols = header.slice(3).filter(Boolean);
  if(kelasCols.length === 0) throw new Error('Kolom kelas tidak ditemukan.');

  const entries = [], forms = {};
  let lastHari = null;
  for(let i = hi+1; i < raw.length; i++){
    const r = raw[i];
    if(!r || r.length < 4) continue;
    let hari = r[0] != null ? String(r[0]).trim().toUpperCase() : null;
    if(hari) lastHari = hari;
    else hari = lastHari;              // tangani sel HARI yang di-merge
    const periode = r[1], waktu = r[2] != null ? String(r[2]).trim() : '';
    if(!hari || !DAYS.includes(hari)) continue;
    for(let c = 3; c < header.length; c++){
      const kelas = header[c];
      if(!kelas) continue;
      let g = r[c];
      if(g == null) continue;
      g = cleanDisplay(g);
      if(!g || g === '-') continue;
      const k = normKey(g);
      (forms[k] = forms[k] || {})[g] = ((forms[k]||{})[g]||0) + 1;
      entries.push([hari, Number(periode), waktu, kelas, k]);
    }
  }
  if(!entries.length) throw new Error('Tidak ada data jadwal yang terbaca.');

  const canon = {};
  Object.keys(forms).forEach(k => {
    canon[k] = Object.keys(forms[k]).sort((a,b) => forms[k][b] - forms[k][a])[0];
  });
  const teachers = Object.values(canon).sort((a,b) => a.localeCompare(b, 'id'));
  const data = entries.map(e => [e[0], e[1], e[2], e[3], canon[e[4]]]);
  return {data, teachers};
}

document.getElementById('fileInput').addEventListener('change', function(e){
  const f = e.target.files[0];
  const status = document.getElementById('uploadStatus');
  status.classList.remove('err');
  if(!f) return;
  status.textContent = 'Memproses ' + f.name + ' …';
  const reader = new FileReader();
  reader.onload = function(ev){
    try {
      const parsed = parseWorkbook(ev.target.result);
      DATA = parsed.data; TEACHERS = parsed.teachers;
      localStorage.setItem(LS_KEY, JSON.stringify({data:DATA, teachers:TEACHERS, filename:f.name}));
      updateBadge();
      status.textContent = 'Berhasil! Data aktif: ' + f.name + ' (' + TEACHERS.length + ' guru, ' + DATA.length + ' entri)';
      document.getElementById('q').value = '';
      document.getElementById('results').innerHTML = '';
      document.getElementById('clearBtn').style.display = 'none';
      document.getElementById('info').textContent = 'Database berhasil diganti. Silakan cari guru.';
    } catch(err){
      status.textContent = 'Gagal membaca: ' + err.message;
      status.classList.add('err');
    }
  };
  reader.readAsArrayBuffer(f);
  e.target.value = '';
});

document.getElementById('exportBtn').addEventListener('click', async () => {

  try {
    if(location.protocol === 'file:') throw new Error('Buka lewat link Vercel, bukan file lokal.');
    status.textContent = 'Menyiapkan file…';
    const src = await (await fetch(location.href, {cache:'no-store'})).text();
    const newSrc = src
      .replace(/const DEFAULT_DATA = [\s\S]*?;/, 'const DEFAULT_DATA = ' + JSON.stringify(DATA) + ';')
      .replace(/const DEFAULT_TEACHERS = [\s\S]*?;/, 'const DEFAULT_TEACHERS = ' + JSON.stringify(TEACHERS) + ';');
    if(newSrc.indexOf(JSON.stringify(DATA).slice(0,50)) < 0) throw new Error('Gagal menyisipkan data.');
    const blob = new Blob([newSrc], {type:'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    a.click();
    URL.revokeObjectURL(a.href);
    status.textContent = 'index.html terdownload (' + TEACHERS.length + ' guru, ' + DATA.length + ' entri). Upload ke GitHub.';
  } catch(err){
    status.textContent = 'Export gagal: ' + err.message;
    status.classList.add('err');
  }
});

function updateBadge(){
  document.getElementById('dbinfo').textContent = TEACHERS.length + ' guru \u2022 ' + DATA.length + ' entri jadwal';
}
updateBadge();

/* ====== PENCARIAN & AUTOCOMPLETE ====== */
const q = document.getElementById('q');
const sugg = document.getElementById('sugg');
const results = document.getElementById('results');
const info = document.getElementById('info');
const clearBtn = document.getElementById('clearBtn');
let activeIdx = -1;

function highlight(name, query){
  const n = name.toLowerCase(), qq = query.toLowerCase();
  const i = n.indexOf(qq);
  if(i < 0) return name;
  return name.slice(0,i) + '<mark>' + name.slice(i, i+query.length) + '</mark>' + name.slice(i+query.length);
}

function showSuggestions(){
  const query = q.value.trim();
  activeIdx = -1;
  if(query.length < 2){ sugg.style.display='none'; return; }
  const nq = normKey(query);
  const matches = TEACHERS.filter(t => normKey(t).includes(nq)).slice(0, 8);
  if(!matches.length){ sugg.style.display='none'; return; }
  sugg.innerHTML = matches.map(t => '<div data-name="' + t.replace(/"/g,'&quot;') + '">' + highlight(t, query) + '</div>').join('');
  sugg.style.display = 'block';
  sugg.querySelectorAll('div').forEach(d => d.addEventListener('mousedown', e => { e.preventDefault(); selectTeacher(d.dataset.name); }));
}

function selectTeacher(name){
  q.value = name;
  sugg.style.display = 'none';
  clearBtn.style.display = 'block';
  render(name);
}

function render(teacher){
  const rows = DATA.filter(r => r[4] === teacher);
  if(!rows.length){ results.innerHTML = '<div class="empty">Jadwal tidak ditemukan untuk guru ini.</div>'; info.textContent=''; return; }
  rows.sort((a,b) => DAYS.indexOf(a[0]) - DAYS.indexOf(b[0]) || a[1] - b[1]);
  info.textContent = rows.length + ' jam mengajar ditemukan untuk "' + teacher + '"';
  let html = '';
  DAYS.forEach(day => {
    const dr = rows.filter(r => r[0] === day);
    if(!dr.length) return;
    html += '<div class="day-title">' + day + '</div><table><thead><tr><th>HARI</th><th>JAM KE</th><th>WAKTU</th><th>KELAS</th></tr></thead><tbody>';
    dr.forEach(r => { html += '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>'; });
    html += '</tbody></table>';
  });
  results.innerHTML = html;
}

q.addEventListener('input', showSuggestions);
q.addEventListener('keydown', e => {
  const items = sugg.querySelectorAll('div');
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if(!items.length) return;
    if(e.key === 'ArrowDown') activeIdx = (activeIdx + 1) % items.length;
    else activeIdx = (activeIdx - 1 + items.length) % items.length;
    items.forEach((it,i) => it.classList.toggle('active', i === activeIdx));
  } else if(e.key === 'Enter'){
    e.preventDefault();
    if(activeIdx >= 0 && items[activeIdx]) selectTeacher(items[activeIdx].dataset.name);
    else if(items.length) selectTeacher(items[0].dataset.name);
    else {
      const exact = TEACHERS.find(t => normKey(t) === normKey(q.value.trim()));
      if(exact) selectTeacher(exact);
      else render(q.value.trim());
    }
  } else if(e.key === 'Escape'){ sugg.style.display='none'; }
});
q.addEventListener('blur', () => setTimeout(() => sugg.style.display='none', 150));
clearBtn.addEventListener('click', () => { q.value=''; results.innerHTML=''; info.textContent='Mulai mengetik nama guru untuk melihat saran, lalu klik / tekan Enter.'; clearBtn.style.display='none'; q.focus(); });
</script>
